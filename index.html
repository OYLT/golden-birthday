<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golden Birthday - The Reveal</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Ma+Shan+Zheng&display=swap');

        body { margin: 0; overflow: hidden; background-color: #020205; font-family: 'Cinzel', serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        #ui-layer { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); }
        
        #main-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: clamp(32px, 6vw, 80px); 
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transform: translate(-50%, 20px);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out, top 1.5s ease-out;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(180deg, #fffdf0 0%, #eacda3 30%, #d6ae7b 60%, #8b6c42 100%);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8));
        }

        #main-title.visible { opacity: 1; transform: translate(-50%, 0); }
        #main-title.pushed-up { top: -10%; opacity: 0; transform: translate(-50%, -50px); }

        #loader { position: absolute; width: 100%; height: 100%; background: #020205; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 1.2s; pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 2px solid rgba(212, 175, 55, 0.1); border-top: 2px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #top-right-controls { position: absolute; top: 20px; right: 20px; z-index: 30; display: flex; flex-direction: row; gap: 15px; pointer-events: auto; }
        .control-col { display: flex; flex-direction: column; gap: 15px; }
        
        .control-btn { background: rgba(10, 10, 10, 0.8); border: 1px solid rgba(212, 175, 55, 0.5); color: #d4af37; width: 100px; padding: 6px 0; border-radius: 4px; font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s ease; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .control-btn:hover { background: rgba(212, 175, 55, 0.2); border-color: #fff; color: #fff; transform: scale(1.05); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .control-btn:active { transform: scale(0.95); }
        
        #file-input, #music-input, #import-input { display: none; }

        #webcam-wrapper { position: absolute; bottom: 20px; right: 20px; opacity: 0; pointer-events: none; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 4px; background: #000; z-index: 50; display: flex; transition: opacity 0.5s; }
        #webcam { display: none; }
        #webcam-preview { width: 100%; height: 100%; transform: scaleX(-1); }

        #letter-editor-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 500px; background: rgba(10, 10, 10, 0.95); border: 1px solid #d4af37; border-radius: 8px; padding: 25px; z-index: 200; display: none; flex-direction: column; gap: 15px; pointer-events: auto; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #letter-editor-modal h3 { color: #d4af37; margin: 0; text-align: center; }
        #letter-text-input { width: 100%; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; padding: 10px; resize: none; outline: none; font-family: sans-serif; }
        .modal-btn-group { display: flex; justify-content: flex-end; gap: 10px; }

        #letter-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease; }
        .letter-paper { height: 80%; aspect-ratio: 3/4; background: linear-gradient(135deg, #1a1a1a 0%, #050505 100%); border: 2px solid #d4af37; padding: 6vh; box-sizing: border-box; position: relative; display: flex; flex-direction: column; transform: translateY(20px); transition: transform 1.5s ease-out; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); }
        .letter-content { font-family: 'Ma Shan Zheng', cursive; font-size: clamp(18px, 2.5vh, 26px); line-height: 1.8; color: #eacda3; text-shadow: 0 0 2px rgba(212, 175, 55, 0.5); white-space: pre-wrap; overflow-y: auto; flex: 1; scroll-behavior: smooth; }
        
        .letter-content::-webkit-scrollbar { width: 4px; }
        .letter-content::-webkit-scrollbar-thumb { background: #d4af37; }
        .cursor::after { content: '|'; animation: blink 1s step-end infinite; color: #d4af37; }
        @keyframes blink { 50% { opacity: 0; } }

        .letter-close-btn { position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; border: 1px solid #666; border-radius: 50%; color: #888; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .letter-close-btn:hover { background: #d4af37; color: #000; border-color: #d4af37; }
        
        #gesture-hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(212, 175, 55, 0.6); font-size: 14px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 40; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>

<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="main-title">Happy 18th Birthday</div>
        <div id="gesture-hint">Gesture Detected: <span id="gesture-name">None</span></div>

        <div id="top-right-controls">
            <div class="control-col" id="col-media">
                <button id="btn-bg-music" class="control-btn">背景音乐</button>
                <button id="btn-add-photo" class="control-btn">上传照片</button>
                <button id="btn-write-letter" class="control-btn">书写信件</button>
                <button id="btn-set-title" class="control-btn">设置标题</button>
            </div>
            <div class="control-col" id="col-system">
                <button id="btn-import" class="control-btn">导入配置</button>
                <button id="btn-export" class="control-btn">导出配置</button>
                <button id="btn-fullscreen" class="control-btn">全屏显示</button>
            </div>
        </div>
        <input type="file" id="file-input" multiple accept="image/*">
        <input type="file" id="music-input" accept="audio/mp3,audio/*">
        <input type="file" id="import-input" accept=".json">
    </div>

    <div id="letter-editor-modal">
        <h3>To My Best Friend</h3>
        <textarea id="letter-text-input" placeholder="写下你的祝福..."></textarea>
        <div class="modal-btn-group">
            <button id="btn-cancel-letter" class="control-btn" style="width: 80px;">取消</button>
            <button id="btn-save-letter" class="control-btn" style="width: 80px;">保存</button>
        </div>
    </div>

    <div id="letter-overlay">
        <div class="letter-paper">
            <div class="letter-close-btn" id="btn-close-letter-mode">×</div>
            <div class="letter-content" id="letter-content-display"></div>
        </div>
    </div>

    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline webkit-playsinline></video>
        <canvas id="webcam-preview"></canvas>
    </div>
    
    <audio id="bg-music" loop crossorigin="anonymous"></audio>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker, DrawingUtils } from '@mediapipe/tasks-vision';

        const CONFIG = {
            colors: {
                bg: 0x020205, 
                gold: 0xffd700, 
                darkGold: 0xaa8800,
                cream: 0xfffdd0, 
                red: 0x990000,
                green: 0x004400,
            },
            particles: { 
                count: 2400,
                dustCount: 1500, 
            },
            camera: { z: 55 },
            gestures: { palmOpenThreshold: 0.35 }
        };

        const STATE = {
            mode: 'TREE', 
            shape: 'SPHERE', 
            hasRevealedCake: false, 
            focusTarget: null, currentPhotoIndex: -1,
            scatterScale: 1.0, gestureBaseSpread: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 }, spinVel: { x: 0, y: 0 }, time: 0,
            wasPointing: false, palmCenter: { x: 0.5, y: 0.5 }, hasPalmCenter: false,
            starMesh: null, starHaloMesh: null,
            letterContent: "", 
            letterTyper: null, letterStartTimer: null, letterLastTriggerTime: 0,
            musicData: null,
            targetPositions: { num1: [], num2: [], num3: [] },
            lastConfettiTime: 0,
            letterOverlayTimeout: null
        };

        let scene, camera, renderer, composer, clock = new THREE.Clock();
        let mainGroup, starGroup, bgGroup, photoMeshGroup, particleSystem = []; 
        let galaxySystem = null; 

        let handLandmarker, video, drawingUtils, canvasCtx;
        let caneTexture, matLib = {};
        
        const _tempVec = new THREE.Vector3();
        const _targetVec = new THREE.Vector3();
        const _invMatrix = new THREE.Matrix4();

        // --- 彩带特效系统 ---
        const confettiParticles = [];
        const confettiGeo = new THREE.PlaneGeometry(0.6, 0.3); 
        const confettiColors = [0xffffaa, 0xffd700, 0xff8800, 0xffffff, 0xff3333]; 

        function createConfettiExplosion() {
            for (let i = 0; i < 400; i++) {
                const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                const mat = new THREE.MeshBasicMaterial({ 
                    color: color, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 1
                });
                const mesh = new THREE.Mesh(confettiGeo, mat);
                
                mesh.position.set(0, 5, 20); 
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 50, 
                    (Math.random()) * 40 - 5, 
                    (Math.random() - 0.5) * 50  
                );

                const rotSpeed = {
                    x: Math.random() * 15 - 7.5,
                    y: Math.random() * 15 - 7.5,
                    z: Math.random() * 15 - 7.5
                };

                scene.add(mesh);
                confettiParticles.push({ mesh, velocity, rotSpeed, life: 1.0 + Math.random() * 0.5 });
            }
        }

        function updateConfetti(dt) {
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.velocity.y -= 25 * dt; 
                p.velocity.x *= 0.96;    
                p.velocity.z *= 0.96;
                p.mesh.position.addScaledVector(p.velocity, dt);
                p.mesh.rotation.x += p.rotSpeed.x * dt;
                p.mesh.rotation.y += p.rotSpeed.y * dt;
                p.mesh.rotation.z += p.rotSpeed.z * dt;
                p.life -= dt * 0.3;
                if (p.life < 0.3) p.mesh.material.opacity = p.life * 3.3;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    if(p.mesh.material) p.mesh.material.dispose();
                    confettiParticles.splice(i, 1);
                }
            }
        }

        function generateNumberPositions() {
            const createPoints = (text) => {
                const cvs = document.createElement('canvas');
                const size = 100;
                cvs.width = size; cvs.height = size;
                const ctx = cvs.getContext('2d');
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.fillText(text, size/2, size/2);
                
                const data = ctx.getImageData(0, 0, size, size).data;
                const points = [];
                for(let y=0; y<size; y+=2) { 
                    for(let x=0; x<size; x+=2) {
                        const i = (y*size + x) * 4;
                        if(data[i] > 128) { 
                            const px = (x - size/2) * 0.4; 
                            const py = -(y - size/2) * 0.4;
                            const pz = (Math.random() - 0.5) * 4; 
                            points.push(new THREE.Vector3(px, py, pz));
                        }
                    }
                }
                return points;
            };

            STATE.targetPositions.num1 = createPoints("1");
            STATE.targetPositions.num2 = createPoints("2");
            STATE.targetPositions.num3 = createPoints("3");
        }

        async function init() {
            generateNumberPositions(); 
            initThree();            
            setupEnvironment();     
            setupLights();          
            createTextures();       
            createMaterials(); 
            createGalaxyBackground(); 
            createParticles();      
            setupPostProcessing();
            setupEvents();          
            setupLetterSystem(); 
            initMediaPipe().catch(console.warn);

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 1200);
            animate(); 
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.012); 

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, CONFIG.camera.z); 

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", depth: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.toneMapping = THREE.ACESFilmicToneMapping; 
            renderer.toneMappingExposure = 1.0; 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            bgGroup = new THREE.Group(); scene.add(bgGroup);
            mainGroup = new THREE.Group(); mainGroup.rotation.x = 0.1; scene.add(mainGroup);
            starGroup = new THREE.Group(); mainGroup.add(starGroup);
            photoMeshGroup = new THREE.Group(); mainGroup.add(photoMeshGroup);
        }

        function setupEnvironment() {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            const bottomLight = new THREE.PointLight(CONFIG.colors.gold, 3, 40);
            bottomLight.position.set(0, -10, 10);
            mainGroup.add(bottomLight);
            
            const spotGold = new THREE.SpotLight(0xfff0dd, 800);
            spotGold.position.set(40, 60, 40); spotGold.angle = 0.4; spotGold.decay = 2;
            scene.add(spotGold);
            
            const spotWarm = new THREE.SpotLight(0xffaa00, 500);
            spotWarm.position.set(-40, 10, -30); spotWarm.lookAt(0,0,0);
            scene.add(spotWarm);
        }

        function setupPostProcessing() {
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloom.threshold = 0.6; bloom.strength = 0.8; bloom.radius = 0.5; 
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(bloom);
        }

        function createTextures() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#d4af37'; 
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) { ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0); }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.colorSpace = THREE.SRGBColorSpace;
            caneTexture.wrapS = THREE.RepeatWrapping; caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(2, 2);
        }

        function createMaterials() {
            matLib.gold = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.9, roughness: 0.15, envMapIntensity: 2.0, emissive: 0x443300, emissiveIntensity: 0.2 });
            matLib.cream = new THREE.MeshStandardMaterial({ color: CONFIG.colors.cream, metalness: 0.1, roughness: 0.4 });
            matLib.red = new THREE.MeshPhysicalMaterial({ color: CONFIG.colors.red, metalness: 0.2, roughness: 0.2, clearcoat: 1.0, emissive: 0x220000, emissiveIntensity: 0.3 });
            matLib.candle = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.3, metalness: 0.4 });
            
            matLib.starGold = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 2.0, metalness: 1.0, roughness: 0 });
            matLib.frameGold = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 1.0, roughness: 0.2 });
            matLib.dust = new THREE.MeshBasicMaterial({ color: 0xffd700, blending: THREE.AdditiveBlending });
        }

        class Particle {
            constructor(mesh, type, isDust = false, index) {
                this.mesh = mesh; this.type = type; this.isDust = isDust;
                this.posCake = new THREE.Vector3(); 
                this.posScatter = new THREE.Vector3();
                this.posNum1 = new THREE.Vector3();
                this.posNum2 = new THREE.Vector3();
                this.posNum3 = new THREE.Vector3();
                this.posSphere = new THREE.Vector3(); 
                
                this.baseScale = mesh.scale.x; 
                this.offset = Math.random() * 100; 
                this.speed = 0.5 + Math.random();
                if (mesh.material && mesh.material.emissive) { this.baseEmissive = mesh.material.emissive.clone(); this.hasEmissive = true; }
                
                this.calculateCakePositions();
                this.calculateNumberPositions(index);
                this.calculateSpherePositions();
            }

            calculateSpherePositions() {
                const r = 10 + Math.random() * 4;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posSphere.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }

            calculateCakePositions() {
                if (this.isDust || this.type === 'PHOTO') {
                    const r = (15 + Math.random()*25);
                    const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                    if (this.isDust) {
                        const angle = Math.random() * Math.PI * 2;
                        const h = (Math.random() - 0.5) * 30;
                        const rad = 8 + Math.random() * 15;
                        this.posCake.set(Math.cos(angle)*rad, h, Math.sin(angle)*rad);
                    }
                    return;
                }

                const rand = Math.random();
                let y, r, tier;
                if (rand < 0.45) { tier = 1; y = -10 + Math.random() * 6; r = 10; } 
                else if (rand < 0.8) { tier = 2; y = -4 + Math.random() * 5; r = 7; } 
                else { tier = 3; y = 1 + Math.random() * 4; r = 4.5; }

                const angle = Math.random() * Math.PI * 2;
                const placeOnTop = Math.random() > 0.85; 
                
                if (placeOnTop) {
                    let topY = (tier === 1) ? -4 : ((tier === 2) ? 1 : 5);
                    const topR = Math.sqrt(Math.random()) * r;
                    this.posCake.set(Math.cos(angle) * topR, topY, Math.sin(angle) * topR);
                } else {
                    const surfR = r + (Math.random() - 0.5) * 0.5;
                    this.posCake.set(Math.cos(angle) * surfR, y, Math.sin(angle) * surfR);
                }

                const rScatter = 15 + Math.random()*15;
                const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
            }

            calculateNumberPositions(index) {
                const assign = (arr, targetVec) => {
                    if (arr.length === 0) { targetVec.copy(this.posScatter); return; }
                    const p = arr[index % arr.length];
                    targetVec.copy(p);
                    targetVec.x += (Math.random()-0.5)*0.2;
                    targetVec.y += (Math.random()-0.5)*0.2;
                };

                assign(STATE.targetPositions.num1, this.posNum1);
                assign(STATE.targetPositions.num2, this.posNum2);
                assign(STATE.targetPositions.num3, this.posNum3);
            }

            update(dt, time, mode, shape, focusTargetMesh, invMatrix) {
                let target, s = this.baseScale, lerpSpeed = 3.0;
                
                if (mode === 'SCATTER') {
                    _targetVec.copy(this.posScatter).multiplyScalar(STATE.scatterScale);
                    target = _targetVec;
                }
                else if (mode === 'LETTER') target = this.posScatter;
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh && invMatrix) {
                        _targetVec.set(0, 0, CONFIG.camera.z - 15).applyMatrix4(invMatrix);
                        target = _targetVec;
                        lerpSpeed = 6.0; this.mesh.lookAt(camera.position); s = this.baseScale * 5.0;
                    } else { target = this.posScatter; s = 0.01; }
                } else {
                    if (shape === 'NUM_1') target = this.posNum1;
                    else if (shape === 'NUM_2') target = this.posNum2;
                    else if (shape === 'NUM_3') target = this.posNum3;
                    else if (shape === 'SPHERE') target = this.posSphere;
                    else target = this.posCake;
                }

                _tempVec.copy(target);
                this.mesh.position.lerp(_tempVec, lerpSpeed * dt);

                if (this.hasEmissive && mode === 'TREE' && !this.isDust) {
                    if (this.type === 'CANDLE') {
                         const flicker = 0.8 + 0.4 * Math.sin(time * 10 + this.offset);
                         this.mesh.material.emissiveIntensity = flicker;
                    }
                }

                if (mode !== 'FOCUS') {
                    if (this.isDust) s = this.baseScale * (0.5 + 0.5 * Math.sin(time * 3 + this.offset));
                    else if ((mode === 'SCATTER' || mode === 'LETTER') && this.type === 'PHOTO') s = this.baseScale * 2.5;
                    
                    if (mode === 'TREE' && (shape === 'NUM_1'||shape === 'NUM_2'||shape === 'NUM_3') && !this.isDust) {
                         s = this.baseScale * 1.2;
                    }
                }
                this.mesh.scale.lerp(_tempVec.set(s,s,s), 5*dt);
            }
        }

        function createGalaxyBackground() {
            const geometry = new THREE.BufferGeometry(), count = 3000;
            const pos = new Float32Array(count * 3), sizes = new Float32Array(count), colors = new Float32Array(count * 3);
            const c1 = new THREE.Color(0xaa8800), c2 = new THREE.Color(0xffffee), c3 = new THREE.Color(0xffd700);
            for(let i=0; i<count; i++) {
                const r = 60 + Math.random()*250, theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
                pos[i*3] = r*Math.sin(phi)*Math.cos(theta); pos[i*3+1] = r*Math.sin(phi)*Math.sin(theta); pos[i*3+2] = r*Math.cos(phi);
                sizes[i] = Math.random()*2.0;
                let c = Math.random(), finalC = c<0.6?c2:(c<0.9?c1:c3);
                colors[i*3]=finalC.r; colors[i*3+1]=finalC.g; colors[i*3+2]=finalC.b;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            galaxySystem = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 1.0, transparent: true, opacity: 0.8, vertexColors: true, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false }));
            bgGroup.add(galaxySystem);
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.4, 16, 16); 
            const boxGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3); 
            const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8); 
            const berryGeo = new THREE.SphereGeometry(0.35, 16, 16); 
            const dustGeo = new THREE.OctahedronGeometry(0.1, 0);

            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random(); 
                let mesh, type;
                
                if (rand < 0.40) { 
                    mesh = new THREE.Mesh(sphereGeo, matLib.cream); type = 'CREAM'; 
                    mesh.scale.setScalar(0.8 + Math.random()*0.5);
                } 
                else if (rand < 0.60) { 
                    mesh = new THREE.Mesh(berryGeo, matLib.red); type = 'BERRY'; 
                    mesh.scale.setScalar(0.8 + Math.random()*0.4);
                } 
                else if (rand < 0.85) { 
                    mesh = new THREE.Mesh(boxGeo, matLib.gold); type = 'CANDY'; 
                    mesh.rotation.set(Math.random(), Math.random(), Math.random());
                } 
                else { 
                    mesh = new THREE.Mesh(cylinderGeo, matLib.candle); type = 'CANDLE'; 
                }

                mainGroup.add(mesh); 
                particleSystem.push(new Particle(mesh, type, false, i));
            }
            
            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                const mesh = new THREE.Mesh(dustGeo, matLib.dust); mesh.scale.setScalar(0.5 + Math.random());
                mainGroup.add(mesh); particleSystem.push(new Particle(mesh, 'DUST', true, i));
            }
            
            createCakeTopper();
        }

        function createCakeTopper() {
            const topperGroup = new THREE.Group();
            
            const num1Geo = new THREE.CylinderGeometry(0.4, 0.4, 4, 16);
            const num1 = new THREE.Mesh(num1Geo, matLib.starGold);
            num1.position.set(-1.5, 0, 0);
            topperGroup.add(num1);

            const torusGeo = new THREE.TorusGeometry(1, 0.4, 16, 32);
            const ringTop = new THREE.Mesh(torusGeo, matLib.starGold);
            ringTop.position.set(1.2, 1.0, 0);
            topperGroup.add(ringTop);
            
            const ringBot = new THREE.Mesh(torusGeo, matLib.starGold);
            ringBot.position.set(1.2, -1.0, 0);
            topperGroup.add(ringBot);

            topperGroup.position.set(0, 8.5, 0);
            
            const halo = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshBasicMaterial({ 
                map: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/sprites/glow.png'), 
                blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.5, color: 0xffaa00 
            }));
            topperGroup.add(halo);

            starGroup.add(topperGroup);
            STATE.starMesh = topperGroup; STATE.starHaloMesh = halo; 
        }

        function addPhotoToScene(texture) {
            if (!texture.image) return;
            const aspect = texture.image.width / texture.image.height;
            let photoW = (aspect >= 1) ? 1.5 : 1.5 * aspect, photoH = (aspect >= 1) ? 1.5 / aspect : 1.5;
            
            const group = new THREE.Group();
            const frameGeo = new THREE.BoxGeometry(photoW + 0.15, photoH + 0.15, 0.1);
            const frame = new THREE.Mesh(frameGeo, matLib.frameGold);
            group.add(frame);
            
            // 使用降低亮度的 BasicMaterial 避免过曝，并禁用 ToneMapping
            const photoMat = new THREE.MeshBasicMaterial({ 
                map: texture,
                color: 0xaaaaaa, // 降低亮度以防止 Bloom 过强
                toneMapped: false // 保持原始色彩
            });
            const photo = new THREE.Mesh(new THREE.PlaneGeometry(photoW, photoH), photoMat);
            photo.position.z = 0.06; group.add(photo);

            photoMeshGroup.add(group); 
            particleSystem.push(new Particle(group, 'PHOTO', false, particleSystem.length));
        }

        function handleImageUpload(e) {
            if(!e.target.files.length) return;
            Array.from(e.target.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => new THREE.TextureLoader().load(ev.target.result, t => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); });
                reader.readAsDataURL(f);
            });
        }

        function exportSceneData() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO').map(p => {
                try {
                    return p.mesh.children[1].material.map.image.src; 
                } catch(e) { return null; }
            }).filter(src => src !== null);

            const exportData = {
                music: STATE.musicData, 
                letter: STATE.letterContent,
                photos: photos,
                title: document.getElementById('main-title').innerText
            };

            const blob = new Blob([JSON.stringify(exportData)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "birthday_gold_18.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function importSceneData(jsonData) {
            try {
                const data = JSON.parse(jsonData);
                if (data.title) document.getElementById('main-title').innerText = data.title;
                if (data.letter) STATE.letterContent = data.letter;
                if (data.music) {
                    STATE.musicData = data.music;
                    const audioEl = document.getElementById('bg-music');
                    audioEl.src = data.music;
                    audioEl.currentTime = 0;
                    audioEl.play().catch(console.warn);
                }
                const photosToRemove = particleSystem.filter(p => p.type === 'PHOTO');
                photosToRemove.forEach(p => photoMeshGroup.remove(p.mesh));
                particleSystem = particleSystem.filter(p => p.type !== 'PHOTO');

                if (data.photos && Array.isArray(data.photos)) {
                    const loader = new THREE.TextureLoader();
                    data.photos.forEach(src => {
                        loader.load(src, t => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); });
                    });
                }
                
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } catch (e) {
                alert("导入失败");
            }
        }

        function setupLetterSystem() {
            const modal = document.getElementById('letter-editor-modal'), txt = document.getElementById('letter-text-input');
            document.getElementById('btn-write-letter').onclick = (e) => { e.stopPropagation(); modal.style.display = 'flex'; txt.value = STATE.letterContent; };
            document.getElementById('btn-cancel-letter').onclick = (e) => { e.stopPropagation(); modal.style.display = 'none'; };
            document.getElementById('btn-save-letter').onclick = (e) => { 
                e.stopPropagation(); 
                STATE.letterContent = txt.value.trim(); 
                modal.style.display = 'none'; 
            };
            document.getElementById('btn-close-letter-mode').onclick = (e) => { e.stopPropagation(); exitLetterMode(); };
        }

        function enterLetterMode() {
            if (STATE.mode === 'LETTER') return;
            if (STATE.letterOverlayTimeout) {
                clearTimeout(STATE.letterOverlayTimeout);
                STATE.letterOverlayTimeout = null;
            }
            
            STATE.mode = 'LETTER';
            const overlay = document.getElementById('letter-overlay'), paper = document.querySelector('.letter-paper'), display = document.getElementById('letter-content-display');
            
            overlay.style.display = 'flex'; 
            requestAnimationFrame(() => { 
                overlay.style.opacity = 1; 
                paper.style.transform = 'translateY(0)'; 
            });
            
            display.textContent = ''; 
            display.classList.remove('cursor');
            
            let i = 0;
            const typeWriter = () => {
                if (STATE.mode !== 'LETTER') return;
                if (i < STATE.letterContent.length) { 
                    display.textContent += STATE.letterContent.charAt(i++); 
                    display.scrollTop = display.scrollHeight; 
                    STATE.letterTyper = setTimeout(typeWriter, 100); 
                }
                else display.classList.remove('cursor');
            };
            STATE.letterStartTimer = setTimeout(() => { 
                if(STATE.mode==='LETTER') { 
                    display.classList.add('cursor'); 
                    typeWriter(); 
                } 
            }, 2000);
        }

        function exitLetterMode() {
            if (STATE.mode !== 'LETTER') return;
            
            STATE.mode = 'TREE'; 
            clearTimeout(STATE.letterTyper); 
            clearTimeout(STATE.letterStartTimer);
            
            const overlay = document.getElementById('letter-overlay'), paper = document.querySelector('.letter-paper');
            overlay.style.opacity = 0; 
            paper.style.transform = 'translateY(20px)';
            
            if (STATE.letterOverlayTimeout) clearTimeout(STATE.letterOverlayTimeout);
            STATE.letterOverlayTimeout = setTimeout(() => { 
                if (STATE.mode !== 'LETTER') {
                    overlay.style.display = 'none'; 
                }
            }, 500);
            
            STATE.spinVel.set(0,0);
        }

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" }, runningMode: "VIDEO", numHands: 1 });
            video = document.getElementById('webcam'); canvasCtx = document.getElementById('webcam-preview').getContext('2d'); drawingUtils = new DrawingUtils(canvasCtx);
            
            if (navigator.mediaDevices?.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: {ideal: 640}, height: {ideal: 480} } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => { 
                    video.play(); 
                    document.getElementById('webcam-wrapper').style.opacity = 1;
                    const aspect = video.videoWidth / video.videoHeight;
                    document.getElementById('webcam-wrapper').style.height = (120/aspect) + 'px';
                    document.getElementById('webcam-preview').width = video.videoWidth;
                    document.getElementById('webcam-preview').height = video.videoHeight;
                    predictWebcam(); 
                });
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime && handLandmarker) {
                lastVideoTime = video.currentTime;
                const result = handLandmarker.detectForVideo(video, performance.now());
                canvasCtx.clearRect(0, 0, canvasCtx.canvas.width, canvasCtx.canvas.height);
                canvasCtx.drawImage(video, 0, 0, canvasCtx.canvas.width, canvasCtx.canvas.height);
                
                if (result.landmarks && result.landmarks.length > 0) {
                    drawingUtils.drawConnectors(result.landmarks[0], HandLandmarker.HAND_CONNECTIONS, { color: "#d4af37", lineWidth: 3 });
                    drawingUtils.drawLandmarks(result.landmarks[0], { color: "#ffffff", lineWidth: 1, radius: 3 });
                    processGestures(result.landmarks[0]);
                } else {
                    STATE.hand.detected = false;
                    // if (STATE.mode === 'LETTER') {
                    //    exitLetterMode();
                    // }
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(lm) {
            STATE.hand.detected = true;

            const dist = (i, j) => Math.hypot(lm[i].x - lm[j].x, lm[i].y - lm[j].y);
            const dIndex = dist(8,0), dMiddle = dist(12,0), dRing = dist(16,0), dPinky = dist(20,0);
            const palmSize = dist(0, 9); 

            // 判断手指伸展
            const isThumbExt = dist(4,0) > palmSize * 0.9;
            const isIndexExt = dIndex > palmSize * 1.2;
            const isMiddleExt = dMiddle > palmSize * 1.2;
            const isRingExt = dRing > palmSize * 1.2;
            const isPinkyExt = dPinky > palmSize * 1.2;

            let fingerCount = 0;
            if (isIndexExt) fingerCount++;
            if (isMiddleExt) fingerCount++;
            if (isRingExt) fingerCount++;
            if (isPinkyExt) fingerCount++;

            // 计算食指的指向性：水平还是垂直
            const indexDx = Math.abs(lm[8].x - lm[5].x);
            const indexDy = Math.abs(lm[8].y - lm[5].y);
            const isIndexHorizontal = indexDx > indexDy;

            const gestureHint = document.getElementById('gesture-name');
            const hintBox = document.getElementById('gesture-hint');
            const mainTitle = document.getElementById('main-title');

            const isPalmOpen = isIndexExt && isMiddleExt && isRingExt && isPinkyExt;
            const isShaka = isThumbExt && isPinkyExt && !isIndexExt && !isMiddleExt && !isRingExt;

            if (isShaka) {
                if (STATE.mode !== 'LETTER') {
                    if (STATE.letterContent.trim() !== "") {
                         enterLetterMode();
                         hintBox.style.opacity = 1; gestureHint.innerText = "Shaka (Open Letter)";
                    } else {
                         hintBox.style.opacity = 1; gestureHint.innerText = "Write a letter first!";
                    }
                }
                return;
            } 
            
            // 如果已经进入信件模式，直接返回，不再响应其他手势，也不自动退出
            if (STATE.mode === 'LETTER') {
                return;
            }
            
            if (isPalmOpen) {
                STATE.mode = 'SCATTER';
                if (STATE.hasRevealedCake) STATE.shape = 'CAKE';
                mainTitle.classList.remove('pushed-up');

                hintBox.style.opacity = 1; gestureHint.innerText = "Scatter";
                
                if (!STATE.hasPalmCenter) {
                    STATE.palmCenter = {x: lm[9].x, y: lm[9].y}; STATE.hasPalmCenter = true; STATE.gestureBaseSpread = (dIndex+dMiddle+dRing+dPinky)/4; STATE.scatterScale = 1.0;
                }
                if (STATE.gestureBaseSpread) {
                    const currentSpread = (dIndex+dMiddle+dRing+dPinky)/4;
                    STATE.scatterScale += (THREE.MathUtils.clamp(Math.pow(STATE.gestureBaseSpread/currentSpread, 2), 0.1, 5.0) - STATE.scatterScale) * 0.15;
                }
                const gain = 6.0, dx = lm[9].x - STATE.palmCenter.x, dy = lm[9].y - STATE.palmCenter.y;
                STATE.spinVel.x += (THREE.MathUtils.clamp(-dy*gain, -3, 3) - STATE.spinVel.x) * 0.2;
                STATE.spinVel.y += (THREE.MathUtils.clamp(dx*gain, -3, 3) - STATE.spinVel.y) * 0.2;
            } else {
                STATE.mode = 'TREE'; 
                STATE.hasPalmCenter = false; STATE.scatterScale = 1.0; STATE.spinVel.x *= 0.9; STATE.spinVel.y *= 0.9;

                const isPistol = isIndexExt && !isMiddleExt && !isRingExt && !isPinkyExt && isThumbExt && isIndexHorizontal;

                if (isPistol) {
                    const photos = particleSystem.filter(p => p.type === 'PHOTO');
                    if (photos.length > 0) {
                        STATE.mode = 'FOCUS';
                        
                        // Find the photo closest to the camera
                        let closestDist = Infinity;
                        let closestMesh = null;
                        const cameraPos = camera.position;

                        photos.forEach(p => {
                            p.mesh.getWorldPosition(_tempVec);
                            const dist = _tempVec.distanceToSquared(cameraPos);
                            if (dist < closestDist) {
                                closestDist = dist;
                                closestMesh = p.mesh;
                            }
                        });

                        STATE.focusTarget = closestMesh;
                        
                        mainTitle.classList.add('pushed-up'); 
                        hintBox.style.opacity = 1; gestureHint.innerText = "Pistol (Nearest Photo)";
                    } else {
                        mainTitle.classList.remove('pushed-up');
                        hintBox.style.opacity = 1; gestureHint.innerText = "No Photos Yet";
                    }
                    return; 
                }

                if (STATE.mode !== 'FOCUS') {
                    mainTitle.classList.remove('pushed-up');
                }

                if (fingerCount === 3 && isIndexExt && isMiddleExt && isRingExt) {
                    STATE.shape = 'NUM_3';
                    hintBox.style.opacity = 1; gestureHint.innerText = "Countdown: 3";
                } else if (fingerCount === 2 && isIndexExt && isMiddleExt) {
                    STATE.shape = 'NUM_2';
                    hintBox.style.opacity = 1; gestureHint.innerText = "Countdown: 2";
                } else if (fingerCount === 1 && isIndexExt) {
                    if (!isIndexHorizontal) {
                        STATE.shape = 'NUM_1';
                        hintBox.style.opacity = 1; gestureHint.innerText = "Countdown: 1";
                    }
                } 
                else if (fingerCount === 0) { 
                    STATE.shape = 'CAKE'; 
                    STATE.hasRevealedCake = true; 
                    
                    if (!mainTitle.classList.contains('visible')) {
                        mainTitle.classList.add('visible');
                    }

                    hintBox.style.opacity = 1; gestureHint.innerText = "Make a Wish!";
                    
                    if (Date.now() - STATE.lastConfettiTime > 2000) { 
                        createConfettiExplosion();
                        STATE.lastConfettiTime = Date.now();
                    }
                }
                else { 
                    if (STATE.hasRevealedCake) {
                        STATE.shape = 'CAKE';
                    } else {
                        STATE.shape = 'SPHERE'; 
                    }
                    if (STATE.mode !== 'SCATTER') hintBox.style.opacity = 0;
                }
            }
            
            STATE.hand.x += ((lm[9].x - 0.5)*3.0 - STATE.hand.x) * 0.1;
            STATE.hand.y += ((lm[9].y - 0.5)*3.0 - STATE.hand.y) * 0.1;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(); STATE.time = clock.elapsedTime;
            const inputX = STATE.hand.detected ? STATE.hand.x : 0; 

            if (STATE.mode === 'LETTER') {
                STATE.rotation.x = THREE.MathUtils.lerp(STATE.rotation.x, Math.PI/4, dt * 1.5); STATE.rotation.y -= 0.1 * dt;
            } else if (STATE.mode === 'TREE') {
                let targetRotX = 0.2;
                if (STATE.shape !== 'CAKE') targetRotX = 0; 

                STATE.rotation.y -= 0.3 * dt; 
                STATE.rotation.x = THREE.MathUtils.lerp(STATE.rotation.x, targetRotX, dt * 2.0); 
                mainGroup.rotation.z = THREE.MathUtils.lerp(mainGroup.rotation.z, inputX * 0.1, dt * 2);
            } else if (STATE.mode === 'SCATTER') {
                STATE.rotation.y += STATE.spinVel.y * dt; STATE.rotation.x += STATE.spinVel.x * dt;
                if (!STATE.hand.detected) { STATE.spinVel.x *= 0.95; STATE.spinVel.y *= 0.95; }
            } else if (STATE.mode === 'FOCUS') {
                _invMatrix.copy(mainGroup.matrixWorld).invert();
            }

            mainGroup.rotation.y = STATE.rotation.y; mainGroup.rotation.x = STATE.rotation.x; 
            
            if (galaxySystem) {
                bgGroup.rotation.y -= 0.03 * dt; 
            }

            if (STATE.starMesh) {
                STATE.starMesh.rotation.y -= dt * 0.5; 
                const isCake = STATE.shape === 'CAKE';
                const targetScale = isCake ? 1.0 : 0.0;
                STATE.starMesh.scale.setScalar(THREE.MathUtils.lerp(STATE.starMesh.scale.x, targetScale, dt * 5));
                STATE.starMesh.position.y = 8.5 + Math.sin(STATE.time * 2) * 0.2; 
            }

            updateConfetti(dt);

            particleSystem.forEach(p => p.update(dt, STATE.time, STATE.mode, STATE.shape, STATE.focusTarget, (STATE.mode === 'FOCUS' ? _invMatrix : null)));
            composer.render();
        }

        function setupEvents() {
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight); });
            
            const fileInput = document.getElementById('file-input');
            document.getElementById('btn-add-photo').onclick = (e) => { e.stopPropagation(); fileInput.click(); };
            fileInput.onchange = handleImageUpload;

            const musicInput = document.getElementById('music-input'), audioEl = document.getElementById('bg-music');
            document.getElementById('btn-bg-music').onclick = (e) => { e.stopPropagation(); musicInput.click(); };
            musicInput.onchange = (e) => { 
                if(e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        STATE.musicData = evt.target.result; 
                        audioEl.src = evt.target.result; 
                        audioEl.currentTime = 0; 
                        audioEl.play().catch(console.warn); 
                    };
                    reader.readAsDataURL(e.target.files[0]);
                } 
            };

            document.getElementById('btn-set-title').onclick = (e) => {
                e.stopPropagation();
                const currentTitle = document.getElementById('main-title').innerText;
                const newTitle = prompt("请输入页面标题:", currentTitle);
                if (newTitle !== null) {
                    document.getElementById('main-title').innerText = newTitle;
                }
            };

            const fsBtn = document.getElementById('btn-fullscreen');
            const controls = document.getElementById('top-right-controls');
            const webcamWrap = document.getElementById('webcam-wrapper');
            const gestureHint = document.getElementById('gesture-hint');

            fsBtn.onclick = (e) => { 
                e.stopPropagation(); 
                document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); 
            };

            document.addEventListener('fullscreenchange', () => {
                const isFullscreen = !!document.fullscreenElement;
                if (isFullscreen) {
                    controls.style.display = 'none';
                    webcamWrap.style.visibility = 'hidden'; 
                    gestureHint.style.opacity = 0;
                } else {
                    controls.style.display = 'flex';
                    webcamWrap.style.visibility = 'visible';
                    gestureHint.style.opacity = 0; 
                }
            });
            
            document.getElementById('btn-export').onclick = (e) => { e.stopPropagation(); exportSceneData(); };
            const importInput = document.getElementById('import-input');
            document.getElementById('btn-import').onclick = (e) => { e.stopPropagation(); importInput.click(); };
            importInput.onchange = (e) => {
                if (e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (evt) => importSceneData(evt.target.result);
                    reader.readAsText(e.target.files[0]);
                }
            };
        }

        init();
    </script>
</body>
</html>
